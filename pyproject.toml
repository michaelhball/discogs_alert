[project]
name = "discogs_alert"
version = "0.1.3"
description = "Configurable, real-time alerts for your discogs wantlist"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mhsb", email = "michael.h.s.ball@gmail.com" }]
keywords = ["discogs", "dig", "digger"]
# PyPI shows these, and the README's Python-versions badge reads them from PyPI.
# Keep them equal to the versions CI tests (`pr_checks.yml`).
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15,<5",
    "click>=8.5,<9",
    "curl_cffi>=0.17,<0.18",
    "httpx>=0.28,<0.29",
    "pydantic>=2.14,<3",
    "requests>=2.34,<3",
]

[project.urls]
Homepage = "https://github.com/michaelhball/discogs_alert"
Repository = "https://github.com/michaelhball/discogs_alert"

# `pip install discogs_alert[menubar]` pulls rumps so the macOS menu-bar
# app (`python -m discogs_alert.menubar`) can run. rumps is gated on
# `sys_platform == "darwin"` so non-Mac installs of the extra silently
# skip it rather than failing.
[project.optional-dependencies]
menubar = ["rumps>=0.4,<0.5; sys_platform == 'darwin'"]

# Console script so `pip install discogs-alert` / `uv tool install discogs-alert`
# / `pipx install discogs-alert` expose a `discogs_alert` command. Same click
# entry point as `python -m discogs_alert`.
[project.scripts]
discogs_alert = "discogs_alert.__main__:main"

# Built-in alerters are registered both here (so `pip install discogs-alert`
# exposes them via entry points) and in
# `discogs_alert.alert.__init__._BUILTIN_ALERTERS` (so editable installs and
# tests work without entry-point installation). The entry-point group keeps
# the alerter lookup table dynamic; new alerters land here as part of a
# regular in-tree PR.
[project.entry-points."discogs_alert.alerters"]
GMAIL = "discogs_alert.alert.gmail:GmailAlerter"
NTFY = "discogs_alert.alert.ntfy:NtfyAlerter"
PUSHBULLET = "discogs_alert.alert.pushbullet:PushbulletAlerter"
TELEGRAM = "discogs_alert.alert.telegram:TelegramAlerter"

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.17",
]
# The tools `make app` needs to build the macOS bundle.
app = [
    "py2app>=0.28; sys_platform == 'darwin'",
    "setuptools>=80; sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "online: marks tests as requiring internet access (select with '--online')",
]

[tool.ruff]
exclude = [".git", ".ruff_cache", "dist", "docker", "img"]
fix = false
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "TID", "W"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
order-by-type = false
