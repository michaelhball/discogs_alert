# Pre-commit hooks. Mirror as much of CI as we cheaply can so failures
# surface locally before push. The full test / coverage matrix only runs
# on CI; here we run the fast subset (lint + offline tests).
#
# Bypass with `git commit --no-verify` if you really need to.

repos:

# Ruff: lint + import-order + tidy-imports. Mirrors the `ruff (Python 3.x)`
# CI matrix — same config (`[tool.ruff]` in pyproject.toml).
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.3
  hooks:
    - id: ruff
      args: ["--fix"]

# uv.lock stays in step with pyproject.toml.
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.13.7
  hooks:
    - id: uv-lock

# Run the offline test subset locally before commit, in the project's own
# uv environment. The full suite (every Python version with coverage gating)
# still runs on CI.
- repo: local
  hooks:
    - id: pytest-offline
      name: pytest (offline)
      entry: uv run --locked pytest -q -m "not online"
      language: system
      pass_filenames: false
      types: [python]
      stages: [pre-commit]
