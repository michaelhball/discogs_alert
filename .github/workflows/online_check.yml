# Once a day, fetch one real marketplace page and parse it. A failed run means
# Discogs changed the HTML and the scraper needs a fix; a warning means
# Cloudflare blocked the runner and nothing was checked.
name: online-check

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Fetch one real marketplace page and parse it
        run: |
          set -euo pipefail
          uv run --locked pytest --online -m online -rs tests/test_online.py | tee "$RUNNER_TEMP/pytest.log"
          if grep -q "SKIPPED.*403" "$RUNNER_TEMP/pytest.log"; then
            echo "::warning::Cloudflare returned 403 from this runner, so the marketplace page layout was not checked today."
          fi
