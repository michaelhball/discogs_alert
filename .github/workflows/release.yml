name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Sanity-check the tag matches pyproject.toml
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pyver="$(uv version --short)"
          if [ "$tag" != "$pyver" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $pyver"
            exit 1
          fi

      - name: Build sdist + wheel
        run: uv build

      - name: Install the wheel into a clean environment and run it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel-venv/bin/discogs_alert" --version | grep -F "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/discogs-alert
    permissions:
      id-token: write  # required for PyPI trusted publishing
    # PyPI failures (e.g. missing trusted-publisher config on pypi.org)
    # shouldn't block the GitHub Release / .app build. Set
    # `continue-on-error` so the chain proceeds and the user can fix
    # PyPI out-of-band if they want.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: Create GitHub Release
    needs: build  # not publish-pypi — independent of PyPI's trusted-publisher setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create release with autogenerated notes
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-latest
    # Setup: set `DOCKERHUB_USERNAME` as a repo VARIABLE (usernames
    # aren't sensitive — keeps the `if:` gate on the same source the
    # login uses) and `DOCKERHUB_TOKEN` as a SECRET.
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/discogs_alert:${{ github.ref_name }}
            ${{ vars.DOCKERHUB_USERNAME }}/discogs_alert:latest

  build-macos-app:
    name: Build macOS .app + .dmg, sign, append to appcast
    needs: github-release
    runs-on: macos-latest
    # GitHub Actions forbids `secrets.*` in `if:` conditionals (the
    # secret's existence would be a side channel), so we can't gate the
    # whole job on whether SPARKLE_PUBLIC_KEY is set. Forks that don't
    # have the secret will fail at the "Stage public key" step with a
    # clear error; that's fine.
    permissions:
      contents: write       # push the appcast branch
      pull-requests: write  # open the appcast PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # py2app bundles the interpreter it runs under; the toolcache build is a
      # macOS framework build, which is what a double-clickable .app needs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Download Sparkle.framework
        run: make sparkle

      - name: Stage public key
        # The build reads the public key from this file via DA_SPARKLE_PUBLIC_KEY.
        # `printf %s` (no newline) keeps the base64 clean.
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.discogs_alert_release
          chmod 700 ~/.discogs_alert_release
          printf '%s' "$SPARKLE_PUBLIC_KEY" > ~/.discogs_alert_release/eddsa_pub.key
          chmod 600 ~/.discogs_alert_release/eddsa_pub.key
          if [ ! -s ~/.discogs_alert_release/eddsa_pub.key ]; then
            echo "::error::SPARKLE_PUBLIC_KEY secret is empty; the app would reject every update"
            exit 1
          fi

      - name: Build .app
        run: make app

      - name: Check the bundle reports the tagged version and carries the public key
        run: |
          plist=dist/discogs_alert.app/Contents/Info.plist
          bundled="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          if [ "$bundled" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::bundle version $bundled does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")"
          if [ "$key" != "$(cat ~/.discogs_alert_release/eddsa_pub.key)" ]; then
            echo "::error::SUPublicEDKey in Info.plist is not the staged public key"
            exit 1
          fi
          test -d dist/discogs_alert.app/Contents/Frameworks/Sparkle.framework

      - name: Build .dmg
        run: make dmg

      - name: Sign DMG with EdDSA
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="dist/discogs_alert-${VERSION}.dmg"
          # `sign_update` reads the private key from stdin via `-f -` and
          # prints `sparkle:edSignature="…" length="…"` to stdout.
          SIG_LINE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | vendor/bin/sign_update --ed-key-file - "$DMG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          # Multi-line-safe output capture (the line itself is single-line
          # but defensive against future format changes).
          {
            echo "signature<<SIGEOF"
            echo "$SIG_LINE"
            echo "SIGEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.sign.outputs.dmg }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$DMG" --clobber

      - name: Open PR to append <item> to docs/appcast.xml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG: ${{ steps.sign.outputs.dmg }}
          VERSION: ${{ steps.sign.outputs.version }}
          SIGNATURE: ${{ steps.sign.outputs.signature }}
        run: |
          set -euo pipefail
          # Direct pushes to `main` are blocked by branch protection, so this opens a PR
          # for the maintainer to merge. The checkout keeps no credentials on disk, because
          # the build steps above run third-party code. `gh` gives git the token for the push.
          gh auth setup-git
          git stash --include-untracked --quiet || true
          git fetch origin main
          git checkout main
          git pull --ff-only

          DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$DMG")"
          python scripts/append_to_appcast.py \
              --version "$VERSION" \
              --signature "$SIGNATURE" \
              --download-url "$DOWNLOAD_URL" \
              --notes "<h2>$GITHUB_REF_NAME</h2>"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/appcast.xml
          if git diff --cached --quiet; then
            echo "::notice::appcast already contains $GITHUB_REF_NAME; nothing to do."
            exit 0
          fi

          BRANCH="release/$GITHUB_REF_NAME-appcast"
          git checkout -b "$BRANCH"
          git commit -m "Append $GITHUB_REF_NAME to appcast"
          git push -u origin "$BRANCH"

          # Build the PR body via printf so we don't need to worry about
          # YAML block-scalar indentation rules eating multi-line strings.
          printf '%s\n\n%s\n\n%s\n' \
              "Auto-generated by the release workflow on push of $GITHUB_REF_NAME." \
              "The corresponding GitHub Release and signed DMG are already published. Merging this PR makes existing \`.app\` installs notice the update via Sparkle on their next poll." \
              "DMG: ${DOWNLOAD_URL}" \
              > "$RUNNER_TEMP/pr_body.md"

          gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Append $GITHUB_REF_NAME to appcast" \
              --body-file "$RUNNER_TEMP/pr_body.md"
